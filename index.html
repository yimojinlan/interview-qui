<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一抹金蓝面试评测</title>
<style>
  :root {
    --primary: #1a1a2e;
    --accent: #4361ee;
    --accent-light: #eef0ff;
    --success: #06d6a0;
    --gold: #d4a843;
    --text: #1a1a2e;
    --text-light: #6b7280;
    --bg: #f5f6fa;
    --card: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --radius: 14px;
    --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Header ===== */
  .header {
    background: #fff;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 0 rgba(0,0,0,.06);
  }
  .header-inner {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-left .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #d4a843, #4361ee);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    font-weight: 700;
  }
  .header-left .title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .header-left .subtitle {
    font-size: 11px;
    color: var(--text-light);
    margin-top: -1px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .header-right .badge {
    font-size: 12px;
    color: var(--text-light);
    background: var(--bg);
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* ===== Dot Progress Bar ===== */
  .progress-dots-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 14px;
  }
  .progress-dots {
    display: flex;
    gap: 4px;
    align-items: center;
    justify-content: center;
  }
  .progress-dots .dot {
    flex: 1;
    max-width: 32px;
    height: 4px;
    border-radius: 2px;
    background: #e5e7eb;
    transition: all .4s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }
  .progress-dots .dot.answered { background: var(--accent); }
  .progress-dots .dot.current { 
    background: var(--accent); 
    box-shadow: 0 0 0 2px var(--accent-light);
    transform: scaleY(1.8);
  }
  .progress-dots .dot.current.answered {
    transform: scaleY(1.8);
  }
  .progress-dots .dot.correct { background: var(--success); }
  .progress-text-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }
  .progress-text-bar .pct {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }
  .progress-text-bar .label {
    font-size: 12px;
    color: var(--text-light);
  }

  /* ===== Container ===== */
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 20px 80px;
  }

  /* ===== Card ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 20px 20px;
    margin-bottom: 0;
    animation: fadeInUp .4s cubic-bezier(.34,1.56,.64,1);
    border: 1px solid rgba(0,0,0,.04);
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-12px); }
  }
  .card.exit {
    animation: fadeOut .2s ease forwards;
  }

  /* ===== Question ===== */
  .q-number-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .q-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .q-tag {
    font-size: 11px;
    color: var(--text-light);
    background: var(--bg);
    padding: 2px 10px;
    border-radius: 20px;
  }
  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.7;
    margin-bottom: 20px;
    color: var(--text);
  }

  /* ===== Options ===== */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1.5px solid #e5e7eb;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all .2s;
    font-size: 14px;
    line-height: 1.6;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }
  .option:active { transform: scale(.985); }
  .option:hover { border-color: #c7d2fe; background: #fafbff; }
  .option .letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid #d1d5db;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #9ca3af;
    transition: all .25s;
  }
  .option.selected {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .option.selected .letter {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  /* ripple effect on select */
  .option.selected::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: .04;
    pointer-events: none;
  }

  /* ===== Basic Info ===== */
  .basic-info-wrap {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 20px;
    margin-bottom: 16px;
    animation: fadeInUp .4s ease;
    border: 1px solid rgba(0,0,0,.04);
  }
  .basic-info-wrap h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .basic-info-wrap .hint {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 16px;
  }
  .basic-info-wrap .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .basic-info-wrap .field-full { grid-column: 1 / -1; }
  .basic-info-wrap label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text-light);
  }
  .basic-info-wrap label .red { color: #ef4444; }
  .basic-info-wrap input,
  .basic-info-wrap select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border .2s, box-shadow .2s;
    background: #fff;
    font-family: inherit;
  }
  .basic-info-wrap input:focus,
  .basic-info-wrap select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  /* ===== Nav ===== */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding: 0 2px;
  }
  .nav .btn-prev {
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    background: transparent;
    color: var(--text-light);
  }
  .nav .btn-prev:hover:not(:disabled) { background: var(--bg); color: var(--text); }
  .nav .btn-prev:disabled { opacity: .3; cursor: not-allowed; }
  .nav .btn-submit {
    padding: 10px 28px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    background: var(--success);
    color: #fff;
  }
  .nav .btn-submit:disabled { opacity: .4; cursor: not-allowed; }
  .nav .btn-submit:not(:disabled):hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(6,208,160,.35); }
  .nav .btn-submit:not(:disabled):active { transform: translateY(0); }

  /* ===== Success ===== */
  .success-screen {
    display: none;
    text-align: center;
    padding: 60px 20px;
    animation: fadeInUp .5s cubic-bezier(.34,1.56,.64,1);
  }
  .success-screen .check-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, #06d6a0, #059669);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #fff;
    box-shadow: 0 8px 24px rgba(6,208,160,.3);
  }
  .success-screen h2 { font-size: 22px; color: #059669; margin-bottom: 8px; }
  .success-screen p { font-size: 14px; color: var(--text-light); line-height: 1.7; }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    padding: 32px 20px;
    font-size: 12px;
    color: #d1d5db;
  }

  /* ===== Loading ===== */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,15,30,.45);
    backdrop-filter: blur(2px);
    z-index: 999;
    justify-content: center;
    align-items: center;
  }
  .loading-overlay.show { display: flex; }
  .loading-box {
    background: #fff;
    border-radius: 20px;
    padding: 36px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #e5e7eb;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-box p { font-size: 14px; color: var(--text-light); }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .container { padding: 12px 16px 80px; }
    .card { padding: 20px 16px; }
    .q-text { font-size: 15px; }
    .option { padding: 12px 14px; font-size: 13px; }
    .basic-info-wrap .field-group { grid-template-columns: 1fr; }
    .basic-info-wrap .field-group .field-full { grid-column: unset; }
    .progress-dots-wrap { padding: 0 16px 10px; }
    .header-inner { padding: 14px 16px 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="logo">JB</div>
      <div>
        <div class="title">面试评测</div>
        <div class="subtitle">一抹金蓝传媒</div>
      </div>
    </div>
    <div class="header-right">
      <span class="badge" id="qCountBadge">15题</span>
    </div>
  </div>
  <div class="progress-dots-wrap">
    <div class="progress-dots" id="progressDots"></div>
    <div class="progress-text-bar">
      <span class="label" id="answeredLabel">已答 0/15</span>
      <span class="pct" id="pctLabel">0%</span>
    </div>
  </div>
</div>

<div class="container" id="quizApp">
  <!-- 基本信息 -->
  <div class="basic-info-wrap" id="basicInfoWrap">
    <h3>📝 基本信息</h3>
    <p class="hint">请先填写以下信息，所有资料仅用于测评分析</p>
    <div class="field-group">
      <div class="field-full">
        <label>姓名 <span class="red">*</span></label>
        <input type="text" id="candidateName" placeholder="请输入姓名" maxlength="30" autocomplete="off">
      </div>
      <div>
        <label>性别 <span class="red">*</span></label>
        <select id="gender">
          <option value="">请选择</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div>
        <label>年龄 <span class="red">*</span></label>
        <input type="number" id="age" placeholder="如 25" min="16" max="99">
      </div>
      <div>
        <label>学历 <span class="red">*</span></label>
        <select id="education">
          <option value="">请选择</option>
          <option value="高中/中专">高中/中专</option>
          <option value="大专">大专</option>
          <option value="本科">本科</option>
          <option value="硕士">硕士</option>
          <option value="博士">博士</option>
        </select>
      </div>
      <div>
        <label>专业</label>
        <input type="text" id="major" placeholder="如：编导、数字媒体" maxlength="40">
      </div>
    </div>
  </div>

  <!-- 题目容器 -->
  <div id="questionsContainer"></div>

  <!-- 导航 -->
  <div class="nav">
    <button class="btn-prev" id="btnPrev" onclick="prevQuestion()">← 上一题</button>
    <button class="btn-submit" id="btnSubmit" onclick="submitQuiz()" style="display:none">✅ 提交测评</button>
  </div>

  <!-- 提交成功 -->
  <div class="success-screen" id="successScreen">
    <div class="check-icon">✓</div>
    <h2>提交成功！</h2>
    <p>感谢您的参与，测评结果已记录。<br>如有疑问请联系人事部门。</p>
  </div>

  <div class="footer">一抹金蓝传媒 · 人事测评工具</div>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p>正在提交测评结果...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/aipexbase-js/dist/aipexbase.umd.min.js"></script>
<script>
const QUESTIONS = [
  { text: '一个已推进两周的剧集项目，因AI模型突发崩坏导致角色一致性大面积失控，重渲代价极大，必须向上汇报。你的第一反应是？',
    options: [
      { letter: 'A', text: '迅速整理"补救翻盘"方案，重点汇报如何用最少帧替换、风格迁移等手法抢回进度，主动提出延期备选方案，淡化损失。' },
      { letter: 'B', text: '出一份详尽的事故复盘报告，分析根因（模型版本/抽卡策略/参数设定），证明过程执行符合最优标准，问题出在外部不可控因素。' },
      { letter: 'C', text: '先私下找制片/组长沟通争取谅解，强调团队加班付出和模型的不稳定性，避免被贴上"质量把控不力"标签。' },
      { letter: 'D', text: '主动揽下全部责任，表示是自己验收没到位，着重汇报已吸取的教训，表现出诚恳改进的姿态。' }
    ]
  },
  { text: '在管线协作中，你和一位跨岗同事长期存在审美/标准分歧，你会？',
    options: [
      { letter: 'A', text: '公开划清界限，直接表明"我的专业判断是这样"，用客观数据或参考片说服对方，在专业上压倒对方。' },
      { letter: 'B', text: '保持礼貌距离，严格用需求文档、修改记录等正式渠道沟通，避免把柄，但内心觉得对方不专业。' },
      { letter: 'C', text: '时而激烈争论坚持己见，时而又担心破坏气氛而妥协，态度忽冷忽热，内耗严重。' },
      { letter: 'D', text: '极度压抑不满，表面照单全收修改意见，但内心积累怨气，可能在某处突然爆发或冷暴力不回消息。' }
    ]
  },
  { text: '在项目审片会上，精心完成的一批成片/分镜被负责人当众全盘否定并严厉批评，你的本能反应是？',
    options: [
      { letter: 'A', text: '当场反驳，指出对方没理解设计意图或技术限制，事后越想越气。' },
      { letter: 'B', text: '表面镇定内心受打击，会后反复琢磨每个细节，陷入"我是不是能力不行"的自我怀疑。' },
      { letter: 'C', text: '感到羞辱但马上迎合意见，会后私下找同事发泄，寻求情绪认同。' },
      { letter: 'D', text: '一言不发脸色异常，会后很长时间不敢再主动提新想法，变得被动保守。' }
    ]
  },
  { text: '面对极度枯燥、重复且看不到即时价值的长期工作（如逐帧修复AI伪影、角色一致性校验），你最可能的表现是？',
    options: [
      { letter: 'A', text: '极度不耐烦，做一段时间就走捷径/写脚本简化流程，或不断要求换更有挑战的任务。' },
      { letter: 'B', text: '咬牙坚持但情绪阴郁暴躁，对打扰自己的人发脾气，变得挑剔刻薄。' },
      { letter: 'C', text: '频繁聊天吐槽，通过摸鱼社交缓解痛苦，拖延症爆发，最后截至日期前赶工。' },
      { letter: 'D', text: '默默按部就班完成，但进入麻木和情感隔离的状态，对周遭漠不关心。' }
    ]
  },
  { text: '这个行业加班是常态，连续三周日均12小时赶项目进度时，你最符合的表现是？',
    options: [
      { letter: 'A', text: '主动调整节奏（间隙眯10分钟、换不同环节保持新鲜感），想办法给自己续命，能顶到项目结束。' },
      { letter: 'B', text: '表面不吭声一直接着干，但内心越来越烦躁，后两周出错率上升，对同事催促变得暴躁。' },
      { letter: 'C', text: '到处喊累吐槽"干不下去了"，但活能赶完，不过周围人都被负面情绪影响。' },
      { letter: 'D', text: '变得沉默寡言，机械性干活，能交差但明显不走心了，下班后完全不想说话。' }
    ]
  },
  { text: '项目组长在关键决策上长期优柔寡断（反复改风格、迟迟不确认分镜），严重影响你的进度，你最可能走向的极端是？',
    options: [
      { letter: 'A', text: '架空他！直接绕过他决策先斩后奏，自己当"实际负责人"，觉得团队没我不行。' },
      { letter: 'B', text: '拿出更多无可挑剔的参考素材和数据，不断用逻辑论证逼他就范。' },
      { letter: 'C', text: '拉拢其他组员形成共识，用舆论压力迫使他改变。' },
      { letter: 'D', text: '内心痛苦但无限期忍耐，替他的每一个犹豫善后，把自己拖垮。' }
    ]
  },
  { text: '当得知同级同事获得了一次你渴望已久的晋升机会时，你内心最阴暗的念头是？',
    options: [
      { letter: 'A', text: '"他不过是运气好/更会来事"，随即开始分析他上位后的权力格局，准备挑战。' },
      { letter: 'B', text: '"评审没眼光，看不出谁才是真正懂行的"，之后用专业细节挑对方毛病。' },
      { letter: 'C', text: '"他肯定在背后做了见不得人的事"，开始有倾向性地传播信息，拉拢"失意者联盟"。' },
      { letter: 'D', text: '"也许我就是不够好"，陷入自我贬低和不公平感，工作热情锐减。' }
    ]
  },
  { text: '公司对AI生成素材的"风格参考度"有模糊的灰色地带，你内心深处对此的态度是？',
    options: [
      { letter: 'A', text: '规则是给跟不上节奏的人定的，只要不被追责、能提升效率，灵活操作无所谓。' },
      { letter: 'B', text: '必须严格按规范执行，而且盯着身边的人也做到。有人打擦边球我会极其愤怒。' },

      { letter: 'C', text: '回避正面评价用"还可以""还行"模糊带过，私下跟信任的人说真话。' },
      { letter: 'D', text: '为维护和谐给出超出实际情况的好评，但心里憋屈。' }
    ]

let answers = new Array(QUESTIONS.length).fill(null);
let currentQ = 0;
let isTransitioning = false;

const client = aipexbase.createClient({
  baseUrl: 'https://baas.kuafuai.net/baas-api',
  apiKey: 'baas_0us8Xwxy'
});

// ========== 渲染进度条圆点 ==========
function renderDots() {
  const container = document.getElementById('progressDots');
  container.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' current' : '');
    dot.dataset.idx = i;
    container.appendChild(dot);
  });
}

// ========== 渲染题目 ==========
function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `q-${idx}`;
    card.style.display = idx === 0 ? 'block' : 'none';
    card.innerHTML = `
      <div class="q-number-wrap">
        <span class="q-number">${idx + 1}</span>
      </div>
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, oi) => `
          <div class="option" data-q="${idx}" data-letter="${opt.letter}" onclick="selectOption(${idx}, '${opt.letter}')">
            <span class="letter">${opt.letter}</span>
            <span>${opt.text}</span>
          </div>
        `).join('')}
      </div>`;
    container.appendChild(card);
  });
}

function selectOption(qIdx, letter) {
  if (isTransitioning) return;
  answers[qIdx] = letter;
  const card = document.getElementById(`q-${qIdx}`);
  card.querySelectorAll('.option').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.letter === letter);
  });
  updateDots();
  updateProgressText();
  updateNavState();

  // 自动跳到下一题（如果是最后一题则不动）
  if (qIdx < QUESTIONS.length - 1) {
    isTransitioning = true;
    setTimeout(() => {
      showQuestion(qIdx + 1);
      isTransitioning = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 350);
  }
}

function showQuestion(idx) {
  // exit animation on current
  const currentCard = document.getElementById(`q-${currentQ}`);
  if (currentCard) currentCard.classList.add('exit');

  setTimeout(() => {
    document.querySelectorAll('.card').forEach(c => {
      c.style.display = 'none';
      c.classList.remove('exit');
    });
    const nextCard = document.getElementById(`q-${idx}`);
    if (nextCard) {
      nextCard.style.display = 'block';
      // trigger reflow for animation
      void nextCard.offsetWidth;
    }
    currentQ = idx;
    updateDots();
    updateProgressText();
    updateNavState();
  }, 200);
}

// ========== 更新进度条 ==========
function updateDots() {
  const dots = document.querySelectorAll('.dot');
  dots.forEach((dot, i) => {
    dot.className = 'dot';
    if (answers[i] !== null) dot.classList.add('answered');
    if (i === currentQ) dot.classList.add('current');
  });
}

function updateProgressText() {
  const answered = answers.filter(a => a !== null).length;
  const total = QUESTIONS.length;
  const pct = Math.round((answered / total) * 100);
  document.getElementById('answeredLabel').textContent = `已答 ${answered}/${total}`;
  document.getElementById('pctLabel').textContent = `${pct}%`;
}

// ========== 基本信息校验 ==========
function isBasicInfoValid() {
  const name = document.getElementById('candidateName').value.trim();
  const gender = document.getElementById('gender').value;
  const age = document.getElementById('age').value.trim();
  const edu = document.getElementById('education').value;
  return name && gender && age && edu;
}

// ========== 导航状态 ==========
function updateNavState() {
  const prevBtn = document.getElementById('btnPrev');
  const submitBtn = document.getElementById('btnSubmit');

  prevBtn.style.visibility = currentQ === 0 ? 'hidden' : 'visible';

  if (currentQ === QUESTIONS.length - 1) {
    submitBtn.style.display = 'block';
    submitBtn.disabled = !isBasicInfoValid() || answers.some(a => a === null);
  } else {
    submitBtn.style.display = 'none';
  }
}

function prevQuestion() {
  if (currentQ > 0 && !isTransitioning) {
    showQuestion(currentQ - 1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ========== 提交 ==========
async function submitQuiz() {
  if (!isBasicInfoValid()) {
    alert('请先填写完整基本信息（姓名、性别、年龄、学历为必填）');
    return;
  }
  if (answers.some(a => a === null)) { alert('还有题目未作答'); return; }

  const name = document.getElementById('candidateName').value.trim();
  const gender = document.getElementById('gender').value;
  const age = parseInt(document.getElementById('age').value.trim(), 10);
  const education = document.getElementById('education').value;
  const major = document.getElementById('major').value.trim();

  const counts = { A: 0, B: 0, C: 0, D: 0 };
  answers.forEach(a => counts[a]++);
  let dominant = 'A';
  let maxCount = 0;
  for (const [key, val] of Object.entries(counts)) {
    if (val > maxCount) { maxCount = val; dominant = key; }
  }

  document.getElementById('loadingOverlay').classList.add('show');

  try {
    const res = await client.db.from('quiz_results').insert().values({
      candidate_name: name,
      gender: gender,
      age: age,
      education: education,
      major: major || '',
      answers: JSON.stringify(answers),
      count_a: counts.A,
      count_b: counts.B,
      count_c: counts.C,
      count_d: counts.D,
      dominant_type: dominant
    });

    if (res.success) {
      document.getElementById('basicInfoWrap').style.display = 'none';
      document.getElementById('questionsContainer').style.display = 'none';
      document.querySelector('.nav').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';
      // 进度条全部点亮
      document.querySelectorAll('.dot').forEach(d => d.classList.add('answered'));
      document.getElementById('pctLabel').textContent = '100%';
      document.getElementById('answeredLabel').textContent = '已完成';
    } else {
      alert('提交失败，请重试：' + (res.message || '未知错误'));
    }
  } catch (e) {
    alert('提交失败，请检查网络后重试：' + e.message);
  } finally {
    document.getElementById('loadingOverlay').classList.remove('show');
  }
}

// ========== 基本输入监听 ==========
['candidateName','gender','age','education'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', updateNavState);
  el.addEventListener('change', updateNavState);
});

// ========== 键盘快捷操作 ==========
document.addEventListener('keydown', function(e) {
  if (['1','2','3','4'].includes(e.key)) {
    const letters = ['1','2','3','4'];
    const idx = letters.indexOf(e.key);
    const options = document.querySelector(`#q-${currentQ}`)?.querySelectorAll('.option');
    if (options && options[idx]) options[idx].click();
  }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevQuestion(); }
});

// ========== 初始化 ==========
renderDots();
renderQuestions();
showQuestion(0);
updateProgressText();
updateNavState();
</script>
