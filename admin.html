  { A: 'A. 规则是给弱者定的，灵活操作', B: 'B. 严格按规范执行，盯别人也做到', C: 'C. 关系好标准可放宽', D: 'D. 照做但内心渴望打破' },
  { A: 'A. 评估可用价值，留作己用', B: 'B. 守口如瓶但形成预判', C: 'C. 修饰后跟熟人"分析"', D: 'D. 装作无事但刻意回避' },
  { A: 'A. 视为累赘，表达不满', B: 'B. 厌恶但冷淡让对方知趣', C: 'C. 边帮边抱怨求回报', D: 'D. 牺牲自己去帮，积攒委屈' }
];

const SECTION_NAMES = ['', '压力与防御机制', '暗面特质倾向', '能量与边界感'];
const QUESTIONS_SECTION = [1,1,1,1,1,2,2,2,3,3];

// ============================================================
// LOGIN
// ============================================================
function doLogin() {
  const pwd = document.getElementById('loginPwd').value;
  if (pwd === PASSWORD) {
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginError').textContent = '密码错误，请重试';
  }
}
function doLogout() {
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginGate').style.display = 'flex';
  document.getElementById('loginPwd').value = '';
  document.getElementById('loginError').textContent = '';
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadData() {
  try {
    const res = await client.db.from('quiz_results').list().order('id', 'desc');
    if (res.success && res.data) {
      renderTable(res.data);
      renderStats(res.data);
    } else {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="empty-msg">加载失败</td></tr>';
    }
  } catch (e) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="empty-msg">加载失败：' + e.message + '</td></tr>';
  }
}

function renderStats(data) {
  const total = data.length;
  const typeCount = { A: 0, B: 0, C: 0, D: 0 };
  const today = new Date().toISOString().slice(0,10);
  let todayCount = 0;
  data.forEach(r => {
    if (r.dominant_type && typeCount[r.dominant_type] !== undefined) typeCount[r.dominant_type]++;
    if (r.created_at && r.created_at.slice(0,10) === today) todayCount++;
  });
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">总答题人数</div></div>
    <div class="stat-card"><div class="num">${todayCount}</div><div class="label">今日答题</div></div>
    <div class="stat-card" style="border-left:3px solid #E74C3C"><div class="num" style="color:#E74C3C">${typeCount.A}</div><div class="label">A型·掌控者</div></div>
    <div class="stat-card" style="border-left:3px solid #3498DB"><div class="num" style="color:#3498DB">${typeCount.B}</div><div class="label">B型·完美主义</div></div>
    <div class="stat-card" style="border-left:3px solid #F39C12"><div class="num" style="color:#F39C12">${typeCount.C}</div><div class="label">C型·社交家</div></div>
    <div class="stat-card" style="border-left:3px solid #27AE60"><div class="num" style="color:#27AE60">${typeCount.D}</div><div class="label">D型·讨好者</div></div>
  `;
}

function renderTable(data) {
  if (data.length === 0) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="empty-msg">暂无数据</td></tr>';
    return;
  }
  const TYPE_STYLES = { A: 'background:#FDEDEC;color:#E74C3C', B: 'background:#EBF5FB;color:#3498DB', C: 'background:#FEF9E7;color:#F39C12', D: 'background:#E8F8F5;color:#27AE60' };
  const TYPE_NAMES = { A: '掌控者', B: '完美主义', C: '社交家', D: '讨好者' };
  let html = '';
  data.forEach((r, idx) => {
    const t = r.dominant_type || '?';
    const style = TYPE_STYLES[t] || '';
    const name = TYPE_NAMES[t] || '';
    const safeName = (r.candidate_name || '').replace(/'/g, "\\'");
    html += `<tr>
      <td>${idx + 1}</td>
      <td><strong>${r.candidate_name || '-'}</strong></td>
      <td>${r.gender || '-'}</td>
      <td>${r.age ?? '-'}</td>
      <td>${r.education || '-'}</td>
      <td>${r.major || '-'}</td>
      <td><span class="type-badge" style="${style}">${t}型·${name}</span></td>
      <td>${r.count_a ?? '-'}</td>
      <td>${r.count_b ?? '-'}</td>
      <td>${r.count_c ?? '-'}</td>
      <td>${r.count_d ?? '-'}</td>
      <td style="font-size:12px;color:#7F8C8D">${r.created_at ? formatTime(r.created_at) : '-'}</td>
      <td><button class="btn-sm btn-view" onclick='showDetail(${JSON.stringify(r).replace(/'/g,"&#39;")})'>查看</button></td>
      <td><button class="btn-sm btn-del" onclick="deleteRecord(${r.id}, '${safeName}')">删除</button></td>
    </tr>`;
  });
  document.getElementById('tableBody').innerHTML = html;
}

function formatTime(t) {
  if (!t) return '-';
  const d = new Date(t);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ============================================================
// DETAIL - COMPREHENSIVE REPORT
// ============================================================
function showDetail(r) {
  const t = r.dominant_type || 'A';
  const prof = PROFILES[t];
  const counts = {
    A: r.count_a ?? 0, B: r.count_b ?? 0, C: r.count_c ?? 0, D: r.count_d ?? 0
  };

  // Parse answers
  let answers = [];
  try { answers = JSON.parse(r.answers || '[]'); } catch(e) {}

  // Build answer block
  let answersHtml = '';
  let curSection = 0;
  answers.forEach((a, i) => {
    if (i >= QUESTIONS_TEXT.length) return;
    const sn = QUESTIONS_SECTION[i];
    if (sn !== curSection) {
      curSection = sn;
      answersHtml += `<div class="section-divider">📌 第${sn}部分：${SECTION_NAMES[sn]}</div>`;
    }
    const optDesc = OPTIONS_TEXT[i] && OPTIONS_TEXT[i][a] ? OPTIONS_TEXT[i][a] : `选 ${a}`;
    answersHtml += `<div class="qa-block">
      <div class="q">Q${i+1}. ${QUESTIONS_TEXT[i]}</div>
      <div class="a">答：<strong>${optDesc}</strong></div>
    </div>`;
  });

  // Build red line match
  let redLineHtml = '';
  RED_LINES.forEach(rl => {
    const conflictTypes = rl.conflict.match(/[A-D]/g) || [];
    const isMatch = conflictTypes.includes(t);
    if (isMatch) {
      redLineHtml += `<div style="background:#FDEDEC;padding:8px 12px;border-radius:8px;margin-bottom:6px;border-left:3px solid #E74C3C">
        <strong>${rl.job}</strong> → ${rl.conflict}<br><span style="font-size:13px;color:#666">${rl.reason}</span>
      </div>`;
    }
  });
  if (!redLineHtml) redLineHtml = '<p style="color:#7F8C8D;font-size:13px">该类型在标准红线范围内无明显冲突。</p>';

  const modalHtml = `
    <!-- 顶部概览 -->
    <div style="text-align:center;margin-bottom:16px">
      <span class="type-badge" style="background:${prof.bgColor};color:${prof.color};font-size:14px;padding:4px 16px">
        ${prof.emoji} ${t}型 — ${prof.name}
      </span>
      <h2 style="margin:10px 0 4px;font-size:20px">${r.candidate_name || '未知'}</h2>
      <div style="font-size:13px;color:#7F8C8D;margin-bottom:6px">
        ${r.gender || '-'} · ${r.age ?? '-'}岁 · ${r.education || '-'}${r.major ? ' · '+r.major : ''}
      </div>
      <div style="font-size:13px;color:#7F8C8D">答题时间：${r.created_at ? formatTime(r.created_at) : '-'}</div>
      <div class="count-grid" style="max-width:320px;margin:8px auto">
        <div class="count-block" style="background:#FDEDEC;color:#E74C3C">A: ${counts.A}</div>
        <div class="count-block" style="background:#EBF5FB;color:#3498DB">B: ${counts.B}</div>
        <div class="count-block" style="background:#FEF9E7;color:#F39C12">C: ${counts.C}</div>
        <div class="count-block" style="background:#E8F8F5;color:#27AE60">D: ${counts.D}</div>
      </div>
    </div>

    <!-- 核心竞争力 -->
    <div class="report-section">
      <h3>💪 核心竞争力</h3>
      <p>${prof.strengths}</p>
    </div>

    <!-- 致命缺陷 -->
    <div class="report-section">
      <h3>⚠️ 致命缺陷</h3>
      <ul>${prof.flaws.map(f => `<li>${f}</li>`).join('')}</ul>
    </div>

    <!-- 加班燃烧曲线 -->
    <div class="report-section">
      <h3>🔥 加班燃烧曲线</h3>
      <p style="font-size:13px;color:#7F8C8D;margin-bottom:6px">常态化连续加班后的状态演变：</p>
      <ul>${prof.burnoutCurve.map(b => `<li>${b}</li>`).join('')}</ul>
      <p style="margin-top:6px;font-weight:600;font-size:13px;color:${prof.color}">${prof.burnoutConclusion}</p>
    </div>

    <!-- 岗位适配 -->
    <div class="report-section">
      <h3>🎯 岗位适配建议</h3>
      <p><span class="tag tag-green">✅ 适合</span> ${prof.goodRoles.join('、')}</p>
      <p><span class="tag tag-red">❌ 不宜</span> ${prof.badRoles.join('、')}</p>
      <p style="margin-top:8px"><strong>管理要点：</strong>${prof.management}</p>
    </div>

    <!-- 抗压底线 -->
    <div class="report-section">
      <h3>💪 抗压底线速查</h3>
      <table class="mini-table">
        <thead><tr><th>类型</th><th>峰值期</th><th>危险信号</th><th>存活期</th><th>建议方向</th></tr></thead>
        <tbody>
          <tr>
            <td><strong style="color:${prof.color}">${t}型</strong></td>
            <td>${prof.tolerance.peak}</td>
            <td>${prof.tolerance.danger}</td>
            <td>${prof.tolerance.survival}</td>
            <td>${prof.tolerance.suggestion}</td>
          </tr>
        </tbody>
      </table>
      <p style="margin-top:6px;font-size:12px;color:#E74C3C">⚠️ C型在常态化高压下存活期最短；D型耐力最长但可能无声崩盘。</p>
    </div>

    <!-- 红线冲突评估 -->
    <div class="report-section">
      <h3>🚫 岗位红线冲突评估</h3>
      ${redLineHtml}
    </div>

    <!-- 答题详情 -->
    <div class="report-section">
      <h3>📝 完整答题记录</h3>
      ${answersHtml || '<p class="no-data">无答题记录</p>'}
    </div>
  `;

  document.getElementById('modalContent').innerHTML = modalHtml;
  document.getElementById('detailModal').classList.add('show');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('show');
}

document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============================================================
// DELETE
// ============================================================
async function deleteRecord(id, name) {
  if (!confirm(`确定要删除 ${name} 的测评记录吗？此操作不可恢复。`)) return;
  try {
    const res = await client.db.from('quiz_results').delete().eq('id', id);
    if (res.success) { loadData(); }
    else { alert('删除失败：' + (res.message || '未知错误')); }
  } catch (e) { alert('删除失败：' + e.message); }
}

// ============================================================
// AUTO REFRESH
// ============================================================
setInterval(loadData, 60000);
</script>
</body>
</html>
