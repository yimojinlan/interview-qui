<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 400" width="100%" height="100%">
  <defs>
    <!-- Yellow gradient: warm gold -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE16D"/>
      <stop offset="15%" stop-color="#F4C430"/>
      <stop offset="35%" stop-color="#E8B020"/>
      <stop offset="55%" stop-color="#D49818"/>
      <stop offset="75%" stop-color="#B87A08"/>
      <stop offset="100%" stop-color="#9A6000"/>
    </linearGradient>
    
    <!-- Blue gradient: cyan to deep blue -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8D8F0"/>
      <stop offset="15%" stop-color="#6BB5E0"/>
      <stop offset="35%" stop-color="#3498DB"/>
      <stop offset="55%" stop-color="#2178A8"/>
      <stop offset="75%" stop-color="#145A88"/>
      <stop offset="100%" stop-color="#082840"/>
    </linearGradient>
    
    <!-- Deep blue accent for bottom -->
    <linearGradient id="deepBlueGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1A5276"/>
      <stop offset="50%" stop-color="#0F3A58"/>
      <stop offset="100%" stop-color="#061E32"/>
    </linearGradient>
    
    <!-- Green transition gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5D665"/>
      <stop offset="30%" stop-color="#7CB83A"/>
      <stop offset="60%" stop-color="#559620"/>
      <stop offset="100%" stop-color="#387310"/>
    </linearGradient>

    <!-- Watercolor texture filter -->
    <filter id="watercolor" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>


