    padding: 12px;

    border-radius: 8px;
    background: #E8ECF0;
    font-size: 14px;

<div class="login-gate" id="loginGate">

</div>

</div>

function doLogin() {

// ============================================================
// DATA STORE
// ============================================================
let allData = [];

// ============================================================
// DATA LOADING
// ============================================================
async function loadData() {
  try {
    const res = await client.db.from('quiz_results').list().order('id', 'desc');
    if (res.success && res.data) {
      allData = res.data;
      renderStats(allData);
      renderDashboard(allData);
      applyFilter();
    } else {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="9" class="empty-msg">加载失败</td></tr>';
    }
  } catch (e) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="9" class="empty-msg">加载失败：' + e.message + '</td></tr>';
  }
}

// ============================================================
// FILTER + SEARCH
// ============================================================
function applyFilter() {
  const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
  const typeVal = document.getElementById('typeFilter').value;
  const riskVal = document.getElementById('riskFilter').value;

  let filtered = allData;
  if (searchVal) {
    filtered = filtered.filter(r => (r.candidate_name || '').toLowerCase().includes(searchVal));
  }
  if (typeVal) {
    filtered = filtered.filter(r => r.dominant_type === typeVal);
  }
  if (riskVal) {
    filtered = filtered.filter(r => calcRiskLevel(r.dominant_type || 'A') === riskVal);
  }
  renderTable(filtered);
}

// ============================================================
// RISK CALC
// ============================================================
function calcRiskLevel(type) {
  const riskMap = { A: 'mid', B: 'low', C: 'high', D: 'mid' };
  return riskMap[type] || 'low';
}
function riskDisplay(level) {
  if (level === 'high') return '<span class="risk-badge risk-high">🔴 高</span>';
  if (level === 'mid') return '<span class="risk-badge risk-mid">🟡 中</span>';
  return '<span class="risk-badge risk-low">🟢 低</span>';
}

// ============================================================
// STATS BAR
// ============================================================
function renderStats(data) {
  const total = data.length;
  const typeCount = { A: 0, B: 0, C: 0, D: 0 };
  const today = new Date().toISOString().slice(0,10);
  let todayCount = 0, maleCount = 0, femaleCount = 0;
  let ageSum = 0, ageCount = 0, ageMin = 99, ageMax = 0;
  data.forEach(r => {
    if (r.dominant_type && typeCount[r.dominant_type] !== undefined) typeCount[r.dominant_type]++;
    if (r.created_at && r.created_at.slice(0,10) === today) todayCount++;
    if (r.gender === '男') maleCount++;
    if (r.gender === '女') femaleCount++;
    const a = parseInt(r.age, 10);
    if (!isNaN(a) && a > 0) { ageSum += a; ageCount++; if (a < ageMin) ageMin = a; if (a > ageMax) ageMax = a; }
  });
  const avgAge = ageCount > 0 ? (ageSum / ageCount).toFixed(1) : '-';
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">总答题人数</div></div>
    <div class="stat-card"><div class="num">${todayCount}</div><div class="label">今日答题</div></div>
    <div class="stat-card"><div class="num">${avgAge}</div><div class="label">平均年龄</div></div>
    <div class="stat-card"><div class="num">${maleCount}/${femaleCount}</div><div class="label">男/女</div></div>
    <div class="stat-card" style="border-left:3px solid #E74C3C"><div class="num" style="color:#E74C3C">${typeCount.A}</div><div class="label">A型·掌控者</div></div>
    <div class="stat-card" style="border-left:3px solid #3498DB"><div class="num" style="color:#3498DB">${typeCount.B}</div><div class="label">B型·完美主义</div></div>
    <div class="stat-card" style="border-left:3px solid #F39C12"><div class="num" style="color:#F39C12">${typeCount.C}</div><div class="label">C型·社交家</div></div>
    <div class="stat-card" style="border-left:3px solid #27AE60"><div class="num" style="color:#27AE60">${typeCount.D}</div><div class="label">D型·讨好者</div></div>
  `;
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard(data) {
  if (data.length === 0) {
    document.getElementById('dashboardRow').innerHTML = '<div class="dashboard-card" style="grid-column:1/-1;text-align:center;color:#95A5A6;padding:30px">暂无数据，无法生成分析图表</div>';
    return;
  }

  // --- 左：类型分布雷达 ---
  const typeCount = { A: 0, B: 0, C: 0, D: 0 };
  data.forEach(r => { if (r.dominant_type && typeCount[r.dominant_type] !== undefined) typeCount[r.dominant_type]++; });
  const total = data.length;
  const typeColors = { A: '#E74C3C', B: '#3498DB', C: '#F39C12', D: '#27AE60' };
  const typeNames = { A: '掌控者', B: '完美主义', C: '社交家', D: '讨好者' };

  let pieHtml = `<h4>📊 候选人类型分布</h4>`;
  let hasData = false;
  for (const k of ['A','B','C','D']) {
    if (typeCount[k] > 0) {
      hasData = true;
      const pct = ((typeCount[k] / total) * 100).toFixed(1);
      pieHtml += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <div style="width:12px;height:12px;border-radius:3px;background:${typeColors[k]};flex-shrink:0"></div>
        <div style="flex:1;font-size:13px">${k}型 ${typeNames[k]}</div>
        <div style="font-size:13px;font-weight:700;color:${typeColors[k]}">${typeCount[k]}人</div>
        <div style="width:100px;height:12px;background:#F0F0F0;border-radius:6px;overflow:hidden;flex-shrink:0">
          <div style="height:100%;width:${pct}%;background:${typeColors[k]};border-radius:6px"></div>
        </div>
        <div style="font-size:11px;color:#95A5A6;width:36px;text-align:right">${pct}%</div>
      </div>`;
    }
  }
  if (!hasData) pieHtml += '<div style="color:#95A5A6;font-size:13px;text-align:center;padding:12px">暂无数据</div>';
  pieHtml += `<div class="pie-legend">🏷️ 类型说明：A=果断进攻 · B=严谨求稳 · C=创意社交 · D=配合执行</div>`;

  // --- 右：近7天趋势 ---
  let trendHtml = '<h4>📈 近7天答题趋势</h4><div class="trend-bar-wrap">';
  const days = [];
  const today = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0,10));
  }
  const dayCounts = {};
  days.forEach(d => dayCounts[d] = 0);
  data.forEach(r => {
    if (r.created_at) {
      const day = r.created_at.slice(0,10);
      if (dayCounts[day] !== undefined) dayCounts[day]++;
    }
  });
  const maxCount = Math.max(1, ...Object.values(dayCounts));
  const dayNames = ['日','一','二','三','四','五','六'];
  days.forEach(d => {
    const cnt = dayCounts[d] || 0;
    const h = Math.max(4, (cnt / maxCount) * 56);
    const dateObj = new Date(d + 'T00:00:00');
    const dow = dayNames[dateObj.getDay()];
    const label = (d === days[6]) ? '今天' : (d === days[5] ? '昨天' : `${dateObj.getMonth()+1}/${dateObj.getDate()}`);
    trendHtml += `<div class="trend-bar" style="height:${h}px;background:#3498DB">
      <div class="trend-label">${label}<br>${cnt}</div>
    </div>`;
  });
  trendHtml += '</div>';
  trendHtml += '<div style="margin-top:18px;font-size:12px;color:#7F8C8D">📌 合计 ' + data.length + ' 人，类型占比可在一览中快速判断面试者结构偏向</div>';

  document.getElementById('dashboardRow').innerHTML =
    '<div class="dashboard-card">' + pieHtml + '</div>' +
    '<div class="dashboard-card">' + trendHtml + '</div>';
}

// ============================================================
// TABLE RENDER (COMPACT)
// ============================================================
function renderTable(data) {
  if (data.length === 0) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="9" class="empty-msg">无匹配数据</td></tr>';
    return;
  }
  const TYPE_STYLES = { A: 'background:#FDEDEC;color:#E74C3C', B: 'background:#EBF5FB;color:#3498DB', C: 'background:#FEF9E7;color:#F39C12', D: 'background:#E8F8F5;color:#27AE60' };
  const TYPE_NAMES = { A: '掌控者', B: '完美主义', C: '社交家', D: '讨好者' };
  const BAR_COLORS = { A: '#E74C3C', B: '#3498DB', C: '#F39C12', D: '#27AE60' };
  let html = '';
  data.forEach((r, idx) => {
    const t = r.dominant_type || 'A';
    const style = TYPE_STYLES[t] || '';
    const name = TYPE_NAMES[t] || '';
    const safeName = (r.candidate_name || '').replace(/'/g, "\\'");

    // Mini bar
    const counts = { A: r.count_a||0, B: r.count_b||0, C: r.count_c||0, D: r.count_d||0 };
    const totalC = counts.A + counts.B + counts.C + counts.D || 1;
    const barHtml = `<div class="mini-bar-wrap">
      <div class="bar-seg" style="width:${(counts.A/totalC*100).toFixed(0)}%;background:#E74C3C" title="A:${counts.A}"></div>
      <div class="bar-seg" style="width:${(counts.B/totalC*100).toFixed(0)}%;background:#3498DB" title="B:${counts.B}"></div>
      <div class="bar-seg" style="width:${(counts.C/totalC*100).toFixed(0)}%;background:#F39C12" title="C:${counts.C}"></div>
      <div class="bar-seg" style="width:${(counts.D/totalC*100).toFixed(0)}%;background:#27AE60" title="D:${counts.D}"></div>
    </div>`;

    // Risk
    const riskLvl = calcRiskLevel(t);

    // Basic info
    const infoParts = [];
    if (r.gender) infoParts.push(r.gender);
    if (r.age) infoParts.push(r.age + '岁');
    if (r.education) infoParts.push(r.education);
    if (r.major) infoParts.push(r.major.length > 6 ? r.major.slice(0,6) + '…' : r.major);

    html += `<tr>
      <td>${idx + 1}</td>
      <td><strong>${r.candidate_name || '-'}</strong></td>
      <td style="font-size:12px;color:#7F8C8D">${infoParts.join(' · ') || '-'}</td>
      <td><span class="type-badge" style="${style}">${t}型·${name}</span></td>
      <td>${barHtml}</td>
      <td class="risk-cell">${riskDisplay(riskLvl)}</td>
      <td style="font-size:12px;color:#7F8C8D">${r.created_at ? formatTime(r.created_at) : '-'}</td>
      <td><button class="btn-sm btn-view" onclick='showDetail(${JSON.stringify(r).replace(/'/g,"&#39;")})'>查看</button></td>
      <td><button class="btn-sm btn-del" onclick="deleteRecord(${r.id}, '${safeName}')">删除</button></td>
    </tr>`;
  });
  document.getElementById('tableBody').innerHTML = html;
}

function formatTime(t) {
  if (!t) return '-';
  const d = new Date(t);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showDetail(r) {

  let answers = [];
  try { answers = JSON.parse(r.answers || '[]'); } catch(e) {}

  let answersHtml = '';

      curSection = sn;

    1: '防御机制理论（Vaillant层级）：评估候选人面对压力、冲突、枯燥时的心理防御方式——从成熟的幽默/升华到不成熟的压抑/行为发泄。',
    2: '暗面人格理论（HDS 11维度）：评估候选人在压力下暴露的"职场暗面"——Excitable（情绪化波动）、Skeptical（多疑不信任）、Reserved（退缩回避）等维度倾向。',
    3: '能量边界理论：评估候选人的人际能量管理——边界清晰度、拒绝能力、情绪劳动承受度、反馈接收与输出方式。'
  };
  const SECTION_DOMINANT = {
    1: { A: '适应性高，主动控制局面', B: '防御性合规，靠逻辑自保', C: '情绪驱动，寻求外部认同', D: '被动压抑，内耗高风险' },
    2: { A: '权力导向，挑战等级秩序', B: '道德审判，严苛标尺', C: '关系操控，拉帮结派倾向', D: '顺从退缩，隐性记仇' },
    3: { A: '清晰果断，边界分明', B: '防御性封闭，疏离沟通', C: '情绪渗漏，三角化倾向', D: '无边界吸收，耗竭风险' }
  };
  let sectionHtml = '';
  for (let sn = 1; sn <= 3; sn++) {
    const sc = sectionCounts[sn];
    const total = sectionTotals[sn] || 1;
    let dom = 'A';
    let maxC = 0;
    for (const k of ['A','B','C','D']) {
      if (sc[k] > maxC) { maxC = sc[k]; dom = k; }
    }
    const profile = SECTION_DOMINANT[sn][dom];
    sectionHtml += `<div style="background:#F8F9FA;border-radius:8px;padding:10px 14px;margin-bottom:10px">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px">📌 第${sn}部分：${SECTION_NAMES[sn]}</div>
      <div style="font-size:12px;color:#7F8C8D;margin-bottom:6px">${SECTION_THEORY[sn]}</div>
      <div class="count-grid" style="max-width:280px;margin:4px 0">
        <div class="count-block" style="background:#FDEDEC;color:#E74C3C;font-size:12px;padding:4px">A: ${sc.A}</div>
        <div class="count-block" style="background:#EBF5FB;color:#3498DB;font-size:12px;padding:4px">B: ${sc.B}</div>
        <div class="count-block" style="background:#FEF9E7;color:#F39C12;font-size:12px;padding:4px">C: ${sc.C}</div>
        <div class="count-block" style="background:#E8F8F5;color:#27AE60;font-size:12px;padding:4px">D: ${sc.D}</div>
      </div>
      <div style="font-size:13px;color:#555"><strong>主导倾向 (${dom}选型)：</strong>${profile}</div>
    </div>`;
  }

  // Build interview suggestions (面试追问建议)
  const INTERVIEW_QUESTIONS = {
    A: [
      '🎯 挑战越权倾向："请回忆一次你绕过直接上级、自行决策的经历。后果是什么？如果再给你一次机会，你会怎么做？"',
      '🎯 规则尊重度："面对一条你认为明显不合理的工作流程，你的处理方式是怎样的？请举具体例子。"',
      '🎯 团队协作："描述一次你与非常缓慢/低于你标准的同事协作的经历。你是忍了、说了、还是采取了行动？结果如何？"',
      '🎯 长期耐力："你能否接受完全重复性工作长达数月的岗位？如果必须做，你会如何调整自己？"',
      '🎯 学习适应力（Q11衍生）："面对完全颠覆现有技能的新工具/新流程，你的具体学习策略是什么？请举例。"'
    ],
    B: [
      '🎯 完美主义与进度平衡："当质量与截止时间冲突时，你如何取舍？请举一个你为进度牺牲过质量（或反之）的例子。"',
      '🎯 协作中的标准冲突："如果协作方的交付质量明显低于你接受的标准，而你反馈多次无效，你的极限在哪里？"',
      '🎯 暗面评判倾向："你如何看待那些专业水准不如你的同事？你会跟他们建立工作关系还是保持距离？"',
      '🎯 沟通方式："当你有不同意见时，你更倾向于写邮件文档、当面说服、还是向上汇报？请举例说明最有效的方式。"',
      '🎯 灵活性与创新（Q13衍生）："标准化流程和你自己摸索的高效工作流冲突时，你怎么解决这个矛盾？请具体描述。"'
    ],
    C: [
      '🎯 注意力持久性："描述一个需要长时间（1个月以上）高度专注但没有即时反馈的项目。你的状态变化是怎样的？"',
      '🎯 情绪独立："当你的创意或方案被连续否定时，你会如何面对？是继续争取还是换个方向？"',
      '🎯 工作边界："同事频繁找你倾诉工作烦恼/吐槽，你如何处理这种情况？"',
      '🎯 独立产出能力："请分享一次你完全独立完成一项从0到1任务的经历——没有团队互动、没有外部认可。感受如何？"',
      '🎯 跨部门协作（Q14衍生）："对方提出你看来\"外行\"的要求时，你的真实第一反应是什么？之后你实际怎么处理的？"'
    ],
    D: [
      '🎯 拒绝能力："请回忆一次你明确对上级或同事说\"不\"的经历。如果完全没有过，为什么？"',
      '🎯 主动表达分歧："当所有同事都同意一个方向，但你心里觉得有问题时，你会说出来吗？为什么？"',
      '🎯 压抑与爆发："你上一次感到工作中极度不公平是什么时候？你是怎么处理的？"',
      '🎯 自我保护机制："如果你的工作量已经饱和，但同事还把任务推给你，你会怎么做？"',
      '🎯 反馈评价倾向（Q15衍生）："当需要客观评价一个与你协作不愉快的同事时，你的本能处理方式是什么？为什么？"'
    ]
  };
  let interviewHtml = '';
  const iqList = INTERVIEW_QUESTIONS[t] || INTERVIEW_QUESTIONS['A'];
  interviewHtml += '<div style="margin-bottom:8px;font-size:13px;color:#7F8C8D">基于候选人认定为【' + t + '型 · ' + prof.name + '】类型的针对性追问建议（适用于面试官根据测评结果深入挖掘）：</div>';
  interviewHtml += '<ul style="padding-left:18px;margin:4px 0">' + iqList.map(q => '<li style="font-size:13px;line-height:1.6;margin-bottom:6px">' + q + '</li>').join('') + '</ul>';
  interviewHtml += '<div style="margin-top:8px;font-size:12px;color:#7F8C8D">💡 建议根据投递岗位（编剧/抽卡师/剪辑/组长等）选择2-3个最相关的问题深入追问，观察候选人回答时的诚实度与自我觉察能力。</div>';

  // Build red line match
  let redLineHtml = '';
  RED_LINES.forEach(rl => {
    const conflictTypes = rl.conflict.match(/[A-D]/g) || [];
    const isMatch = conflictTypes.includes(t);
    if (isMatch) {
      redLineHtml += '<div style="background:#FDEDEC;padding:8px 12px;border-radius:8px;margin-bottom:6px;border-left:3px solid #E74C3C">' +
        '<strong>' + rl.job + '</strong> → ' + rl.conflict + '<br><span style="font-size:13px;color:#666">' + rl.reason + '</span></div>';
    }
  });
  if (!redLineHtml) redLineHtml = '<p style="color:#7F8C8D;font-size:13px">该类型在标准红线范围内无明显冲突。</p>';

  const modalHtml = `
    <!-- 顶部概览 -->
    <div style="text-align:center;margin-bottom:16px">
      <span class="type-badge" style="background:${prof.bgColor};color:${prof.color};font-size:14px;padding:4px 16px">
        ${prof.emoji} ${t}型 — ${prof.name}
      </span>
      <h2 style="margin:10px 0 4px;font-size:20px">${r.candidate_name || '未知'}</h2>
      <div style="font-size:13px;color:#7F8C8D;margin-bottom:6px">
        ${r.gender || '-'} · ${r.age ?? '-'}岁 · ${r.education || '-'}${r.major ? ' · '+r.major : ''}
      </div>
      <div style="font-size:13px;color:#7F8C8D">答题时间：${r.created_at ? formatTime(r.created_at) : '-'}</div>
      <div class="count-grid" style="max-width:320px;margin:8px auto">
        <div class="count-block" style="background:#FDEDEC;color:#E74C3C">A: ${counts.A}</div>
        <div class="count-block" style="background:#EBF5FB;color:#3498DB">B: ${counts.B}</div>
        <div class="count-block" style="background:#FEF9E7;color:#F39C12">C: ${counts.C}</div>
        <div class="count-block" style="background:#E8F8F5;color:#27AE60">D: ${counts.D}</div>
      </div>
    </div>

    <!-- 核心竞争力 -->
    <div class="report-section">
      <h3>💪 核心竞争力</h3>
      <p>${prof.strengths}</p>
    </div>

    <!-- 致命缺陷 -->
    <div class="report-section">
      <h3>⚠️ 致命缺陷</h3>
      <ul>${prof.flaws.map(f => `<li>${f}</li>`).join('')}</ul>
    </div>

    <!-- 加班燃烧曲线 -->
    <div class="report-section">
      <h3>🔥 加班燃烧曲线</h3>
      <p style="font-size:13px;color:#7F8C8D;margin-bottom:6px">常态化连续加班后的状态演变：</p>
      <ul>${prof.burnoutCurve.map(b => `<li>${b}</li>`).join('')}</ul>
      <p style="margin-top:6px;font-weight:600;font-size:13px;color:${prof.color}">${prof.burnoutConclusion}</p>
    </div>

    <!-- 岗位适配 -->
    <div class="report-section">
      <h3>🎯 岗位适配建议</h3>
      <p><span class="tag tag-green">✅ 适合</span> ${prof.goodRoles.join('、')}</p>
      <p><span class="tag tag-red">❌ 不宜</span> ${prof.badRoles.join('、')}</p>
      <p style="margin-top:8px"><strong>管理要点：</strong>${prof.management}</p>
    </div>

    <!-- 抗压底线 -->
    <div class="report-section">
      <h3>💪 抗压底线速查</h3>
      <table class="mini-table">
        <thead><tr><th>类型</th><th>峰值期</th><th>危险信号</th><th>存活期</th><th>建议方向</th></tr></thead>
        <tbody>
          <tr>
            <td><strong style="color:${prof.color}">${t}型</strong></td>
            <td>${prof.tolerance.peak}</td>
            <td>${prof.tolerance.danger}</td>
            <td>${prof.tolerance.survival}</td>
            <td>${prof.tolerance.suggestion}</td>
          </tr>
        </tbody>
      </table>
      <p style="margin-top:6px;font-size:12px;color:#E74C3C">⚠️ C型在常态化高压下存活期最短；D型耐力最长但可能无声崩盘。</p>
    </div>

    <!-- 各部分分析 -->
    <div class="report-section">
      <h3>📊 各部分分析</h3>
      ${sectionHtml || '无各部分数据'}
    </div>

    <!-- 面试追问建议 -->
    <div class="report-section">
      <h3>🎙️ 面试追问建议</h3>
      ${interviewHtml || '无追问建议数据'}
    </div>

    <!-- 红线冲突评估 -->
    <div class="report-section">
      <h3>🚫 岗位红线冲突评估</h3>
      ${redLineHtml}
    </div>

    <!-- 答题详情 -->
    <div class="report-section">
      <h3>📝 完整答题记录</h3>
      ${answersHtml || '<p class="no-data">无答题记录</p>'}
    </div>
  `;

  document.getElementById('modalContent').innerHTML = modalHtml;
  document.getElementById('detailModal').classList.add('show');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('show');
}

document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============================================================
// DELETE
// ============================================================
async function deleteRecord(id, name) {
  if (!confirm(`确定要删除 ${name} 的测评记录吗？此操作不可恢复。`)) return;
  try {
    const res = await client.db.from('quiz_results').delete().eq('id', id);
    if (res.success) { loadData(); }
    else { alert('删除失败：' + (res.message || '未知错误')); }
  } catch (e) { alert('删除失败：' + e.message); }
}

// ============================================================
// AUTO REFRESH
// ============================================================
// ============================================================
// CSV EXPORT
// ============================================================
function exportCSV() {
  if (allData.length === 0) { alert('暂无数据可导出'); return; }
  const rows = [['序号','姓名','性别','年龄','学历','专业','主导类型','A数','B数','C数','D数','答题时间']];
  allData.forEach((r, idx) => {
    rows.push([
      idx+1, r.candidate_name||'', r.gender||'', r.age||'', r.education||'', r.major||'',
      r.dominant_type||'', r.count_a||0, r.count_b||0, r.count_c||0, r.count_d||0,
      r.created_at ? formatTime(r.created_at) : ''
    ]);
  });
  const csv = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '一抹金蓝测评结果_' + new Date().toISOString().slice(0,10) + '.csv';
  link.click();
  URL.revokeObjectURL(link.href);
}

setInterval(loadData, 60000);
