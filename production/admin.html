<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>制作管理后台 - 一抹金蓝</title>
<style>
  :root {
    --primary: #2C3E50;
    --accent: #3498DB;
    --success: #27AE60;
    --danger: #E74C3C;
    --text: #2C3E50;
    --text-light: #7F8C8D;
    --bg: #F5F6FA;
    --card: #fff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100dvh;
  }

  /* ===== 密码门 ===== */
  .password-gate {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    padding: 32px;
  }
  .password-gate .lock-icon { font-size: 48px; margin-bottom: 16px; }
  .password-gate h2 { color: #fff; font-size: 20px; margin-bottom: 6px; font-weight: 700; }
  .password-gate p { color: rgba(255,255,255,.5); font-size: 13px; margin-bottom: 20px; }
  .password-gate input {
    width: 280px; max-width: 90%;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    text-align: center;
    letter-spacing: 4px;
    background: rgba(255,255,255,.12);
    color: #fff;
    backdrop-filter: blur(4px);
  }
  .password-gate input::placeholder { color: rgba(255,255,255,.35); letter-spacing: 0; }
  .password-gate input:focus { background: rgba(255,255,255,.2); }
  .password-gate .error { color: #F87171; font-size: 13px; margin-top: 10px; min-height: 20px; }
  .password-gate .btn-unlock {
    margin-top: 14px;
    padding: 10px 36px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    background: rgba(255,255,255,.15);
    color: #fff;
    cursor: pointer;
    transition: all .15s;
  }
  .password-gate .btn-unlock:active { transform: scale(.96); }
  .password-gate .btn-unlock:hover { background: rgba(255,255,255,.25); }

  .app-content { display: none; }

  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    padding: 20px 24px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header p { font-size: 12px; opacity: .6; margin-top: 2px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
    text-align: center;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .stat-card .label { font-size: 11px; color: var(--text-light); }

  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .filter-bar input, .filter-bar select {
    padding: 8px 12px;
    border: 1.5px solid #E8ECF0;
    border-radius: var(--radius-sm);
    font-size: 13px;
    outline: none;
    background: #fff;
    flex: 1;
    min-width: 120px;
  }
  .filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent); }

  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1050px; }
  th {
    background: #f8f9fb;
    padding: 10px 8px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    color: var(--text-light);
    white-space: nowrap;
    border-bottom: 1px solid #E8ECF0;
    position: sticky;
    top: 0;
  }
  td {
    padding: 10px 8px;
    border-bottom: 1px solid #f0f1f3;
    vertical-align: middle;
  }
  tr:hover td { background: #fafbfc; }
  .editable {
    cursor: pointer;
    border-bottom: 1px dashed var(--accent);
    transition: background .15s;
  }
  .editable:hover { background: #EBF5FB; }
  .editable-input {
    width: 100%;
    padding: 4px 6px;
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    font-size: 13px;
    outline: none;
    background: #fff;
    max-width: 90px;
  }
  .amount { text-align: right; font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; white-space: nowrap; }

  .detail-row { display: none; }
  .detail-row.show { display: table-row; }
  .detail-row td { background: #fafbfc; padding: 14px 16px; }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
  }
  .detail-item {}
  .detail-item .d-label { font-size: 11px; color: var(--text-light); }
  .detail-item .d-value { font-size: 14px; font-weight: 600; margin-top: 2px; }

  .expand-btn {
    background: none; border: none; font-size: 14px; cursor: pointer;
    color: var(--text-light); padding: 2px 6px; border-radius: 4px;
  }
  .expand-btn:hover { background: #f0f1f3; }
  .btn-delete {
    display: inline-block;
    padding: 3px 10px;
    border: none;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    background: var(--danger);
    color: #fff;
  }
  .btn-delete:hover { filter: brightness(1.1); }

  @media (max-width: 640px) {
    .stats-bar { grid-template-columns: repeat(3, 1fr); }
    .container { padding: 12px; }
    th, td { padding: 8px 5px; font-size: 12px; }
  }

  .loading-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(44,62,80,.4);
    z-index: 999;
    justify-content: center;
    align-items: center;
  }
  .loading-overlay.show { display: flex; }
  .loading-box {
    background: #fff;
    border-radius: 18px;
    padding: 32px 40px;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0,0,0,.12);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #E8ECF0;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { text-align: center; padding: 24px; font-size: 11px; color: #BDC3C7; }
</style>
</head>
<body>

<!-- ===== 密码门 ===== -->
<div class="password-gate" id="passwordGate">
  <div class="lock-icon">🔐</div>
  <h2>制作管理后台</h2>
  <p>请输入管理密码</p>
  <input type="password" id="pwdInput" placeholder="管理密码" maxlength="30" autocomplete="off">
  <div class="error" id="pwdError"></div>
  <button class="btn-unlock" onclick="checkPassword()">进入后台</button>
</div>

<!-- ===== 主内容 ===== -->
<div class="app-content" id="appContent">
<div class="header">
  <h1>📊 制作管理后台</h1>
  <p>一抹金蓝传媒 · 项目成本利润核算</p>
</div>

<div class="container">
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="num" id="statProjects">-</div><div class="label">项目总数</div></div>
    <div class="stat-card"><div class="num" id="statTotalStaff">-</div><div class="label">总人力（人月）</div></div>
    <div class="stat-card"><div class="num" id="statTotalCompute">-</div><div class="label">总算力成本</div></div>
    <div class="stat-card"><div class="num" id="statTotalCost">-</div><div class="label">总成本（含算力）</div></div>
    <div class="stat-card"><div class="num" id="statTotalRevenue">-</div><div class="label">总收入</div></div>
    <div class="stat-card"><div class="num" id="statTotalProfit">-</div><div class="label">总利润</div></div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜索项目..." oninput="applyFilters()">
    <select id="sortSelect" onchange="applyFilters()">
      <option value="newest">最新优先</option>
      <option value="oldest">最早优先</option>
      <option value="profit_desc">利润从高到低</option>
      <option value="profit_asc">利润从低到高</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:26px"></th>
          <th>项目名称</th>
          <th>时长/集数</th>
          <th>周期/人数</th>
          <th>算力成本</th>
          <th>人员成本</th>
          <th>电脑+场地</th>
          <th>总成本</th>
          <th>订单单价</th>
          <th>提成</th>
          <th>利润</th>
          <th style="width:60px"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">一抹金蓝传媒 · 制作部管理系统</div>
</div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/aipexbase-js/dist/aipexbase.umd.min.js"></script>
<script>
const ADMIN_PASSWORD = 'ymjl2026088';

// ===== 常量 =====
const AVG_SALARY_PER_MONTH = 3500;
const WORK_DAYS_PER_MONTH = 26;
const PC_COST_PER_MONTH = 193;
const VENUE_COST_PER_MONTH = 8000;

const client = aipexbase.createClient({
  baseUrl: 'https://baas.kuafuai.net/baas-api',
  apiKey: 'baas_0us8Xwxy'
});

let projects = [];
let editingId = null;

// ===== 密码 =====
function checkPassword() {
  const input = document.getElementById('pwdInput').value;
  const err = document.getElementById('pwdError');
  if (input === ADMIN_PASSWORD) {
    document.getElementById('passwordGate').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    loadData();
  } else {
    err.textContent = '密码错误';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}
document.getElementById('pwdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});

// ===== 核算 =====
function calcCosts(p) {
  const days = p.production_days;
  const months = days / WORK_DAYS_PER_MONTH;
  const laborPerDay = AVG_SALARY_PER_MONTH / WORK_DAYS_PER_MONTH;
  const pcPerDay = PC_COST_PER_MONTH / WORK_DAYS_PER_MONTH;
  const venuePerDay = VENUE_COST_PER_MONTH / WORK_DAYS_PER_MONTH;
  const laborCost = days * p.team_size * laborPerDay;
  const pcCost = days * p.team_size * pcPerDay;
  const venueCost = days * venuePerDay;
  const baseCost = laborCost + pcCost + venueCost;
  const computeCost = parseFloat(p.total_compute_cost) || 0;
  const totalCost = baseCost + computeCost;
  const revenue = parseFloat(p.order_price) || 0;
  const commission = parseFloat(p.commission) || 0;
  const profit = revenue - totalCost - commission;
  return { days, months, laborPerDay, pcPerDay, venuePerDay, laborCost, pcCost, venueCost, computeCost, baseCost, totalCost, revenue, commission, profit };
}

const fmt = v => '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const fmt2 = v => Number(v).toFixed(2);

// ===== 渲染 =====
function renderTable(list) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  list.forEach(p => {
    const c = calcCosts(p);
    const pcAndVenue = c.pcCost + c.venueCost;
    const profitClass = c.profit >= 0 ? 'positive' : 'negative';
    // 内联样式因为amount类没有定义positive/negative颜色
    const profitColor = c.profit >= 0 ? 'var(--success)' : 'var(--danger)';
    const linkDisplay = p.cloud_link && p.cloud_link.length > 0
      ? `<a href="${escHtml(p.cloud_link)}" target="_blank" style="font-size:11px;color:var(--accent)">🔗 查看</a>`
      : '<span style="color:var(--text-light);font-size:11px">—</span>';

    tbody.innerHTML += `
      <tr id="row-${p.id}">
        <td><button class="expand-btn" onclick="toggleDetail(${p.id})">▶</button></td>
        <td><strong>${escHtml(p.project_name)}</strong></td>
        <td>${p.total_duration}min / ${p.total_episodes}集</td>
        <td>${p.production_days}天/${p.team_size}人</td>
        <td class="amount">${c.computeCost ? fmt(c.computeCost) : '—'}</td>
        <td class="amount">${fmt(c.laborCost)}</td>
        <td class="amount">${fmt(pcAndVenue)}</td>
        <td class="amount"><strong>${fmt(c.totalCost)}</strong></td>
        <td class="amount">
          ${editingId === p.id
            ? `<input class="editable-input" type="number" id="editPrice-${p.id}" value="${c.revenue}" step="0.01" min="0">
               <button style="padding:2px 8px;border:none;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;background:var(--success);color:#fff;vertical-align:middle" onclick="saveEdit(${p.id})">✓</button>`
            : `<span class="editable" onclick="startEdit(${p.id})">${c.revenue ? fmt(c.revenue) : '—'}</span>`
          }
        </td>
        <td class="amount">
          ${editingId === p.id
            ? `<input class="editable-input" type="number" id="editComm-${p.id}" value="${c.commission}" step="0.01" min="0">`
            : `<span class="editable" onclick="startEdit(${p.id})">${c.commission ? fmt(c.commission) : '—'}</span>`
          }
        </td>
        <td class="amount" style="color:${profitColor};font-weight:700">${c.profit >= 0 ? '📈' : '📉'} ${fmt(c.profit)}</td>
        <td>
          <button class="btn-delete" onclick="deleteProject(${p.id}, '${escHtml(p.project_name).replace(/'/g, "\\'")}')">删除</button>
        </td>
      </tr>
      <tr class="detail-row" id="detail-${p.id}">
        <td colspan="12">
          <div class="detail-grid">
            <div class="detail-item"><div class="d-label">制作周期</div><div class="d-value">${p.production_days} 天</div></div>
            <div class="detail-item"><div class="d-label">制作人数</div><div class="d-value">${p.team_size} 人</div></div>
            <div class="detail-item"><div class="d-label">每日人力（${fmt(AVG_SALARY_PER_MONTH)}÷26）</div><div class="d-value">${fmt(c.laborPerDay)}/人/天</div></div>
            <div class="detail-item"><div class="d-label">人员成本</div><div class="d-value">${fmt(c.laborCost)}</div></div>
            <div class="detail-item"><div class="d-label">每日电脑（${fmt(PC_COST_PER_MONTH)}÷26）</div><div class="d-value">${fmt(c.pcPerDay)}/台/天</div></div>
            <div class="detail-item"><div class="d-label">电脑成本</div><div class="d-value">${fmt(c.pcCost)}</div></div>
            <div class="detail-item"><div class="d-label">每日场地（${fmt(VENUE_COST_PER_MONTH)}÷26）</div><div class="d-value">${fmt(c.venuePerDay)}/天</div></div>
            <div class="detail-item"><div class="d-label">场地费</div><div class="d-value">${fmt(c.venueCost)}</div></div>
            <div class="detail-item"><div class="d-label">每分钟算力成本</div><div class="d-value">${p.compute_cost_per_min ? fmt(p.compute_cost_per_min) + '/min' : '—'}</div></div>
            <div class="detail-item"><div class="d-label">总算力成本</div><div class="d-value">${c.computeCost ? fmt(c.computeCost) : '—'}</div></div>
            <div class="detail-item" style="grid-column:1/-1;border-top:1px solid #eee;padding-top:6px"><div class="d-label">不含算力的基础成本</div><div class="d-value">${fmt(c.baseCost)}</div></div>
            <div class="detail-item"><div class="d-label">总成本</div><div class="d-value"><strong>${fmt(c.totalCost)}</strong></div></div>
            <div class="detail-item"><div class="d-label">订单单价</div><div class="d-value">${c.revenue ? fmt(c.revenue) : '— 未填'}</div></div>
            <div class="detail-item"><div class="d-label">提成</div><div class="d-value">${c.commission ? fmt(c.commission) : '— 未填'}</div></div>
            <div class="detail-item"><div class="d-label">利润</div><div class="d-value" style="color:${profitColor}">${c.profit >= 0 ? '📈' : '📉'} ${fmt(c.profit)}</div></div>
          </div>
          <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:10px; font-size:12px">
            <span><strong>软件：</strong>${p.software || '—'}</span>
            <span><strong>网盘：</strong>${linkDisplay}</span>
          </div>
          <div style="margin-top:4px; font-size:11px; color:var(--text-light)">登记时间：${p.created_at || '—'}</div>
        </td>
      </tr>
    `;
  });
}

// ===== 统计 =====
function updateStats(list) {
  document.getElementById('statProjects').textContent = list.length;
  let totalMonths = 0, totalCompute = 0, totalCost = 0, totalRevenue = 0, totalProfit = 0;
  list.forEach(p => {
    const c = calcCosts(p);
    totalMonths += c.months * p.team_size;
    totalCompute += c.computeCost;
    totalCost += c.totalCost;
    totalRevenue += c.revenue;
    totalProfit += c.profit;
  });
  document.getElementById('statTotalStaff').textContent = totalMonths.toFixed(1);
  document.getElementById('statTotalCompute').textContent = fmt(totalCompute);
  document.getElementById('statTotalCost').textContent = fmt(totalCost);
  document.getElementById('statTotalRevenue').textContent = fmt(totalRevenue);
  const profitEl = document.getElementById('statTotalProfit');
  profitEl.textContent = fmt(totalProfit);
  profitEl.style.color = totalProfit >= 0 ? 'var(--success)' : 'var(--danger)';
}

// ===== 过滤排序 =====
function applyFilters() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  let list = [...projects];
  if (keyword) list = list.filter(p => p.project_name.toLowerCase().includes(keyword));
  list.sort((a, b) => {
    const ca = calcCosts(a), cb = calcCosts(b);
    switch (sort) {
      case 'oldest': return new Date(a.created_at) - new Date(b.created_at);
      case 'profit_desc': return cb.profit - ca.profit;
      case 'profit_asc': return ca.profit - cb.profit;
      default: return new Date(b.created_at) - new Date(a.created_at);
    }
  });
  renderTable(list);
  updateStats(list);
}

// ===== 展开 =====
function toggleDetail(id) {
  const row = document.getElementById(`detail-${id}`);
  const btn = document.querySelector(`#row-${id} .expand-btn`);
  if (!row) return;
  row.classList.toggle('show');
  btn.textContent = row.classList.contains('show') ? '▼' : '▶';
}

// ===== 编辑 =====
function startEdit(id) { editingId = id; applyFilters(); }
function saveEdit(id) {
  const price = parseFloat(document.getElementById(`editPrice-${id}`).value) || 0;
  const comm = parseFloat(document.getElementById(`editComm-${id}`).value) || 0;
  document.getElementById('loadingOverlay').classList.add('show');
  client.db.from('projects').update()
    .set({ order_price: price, commission: comm })
    .where({ id: id })
    .then(res => {
      if (res.success) {
        const p = projects.find(x => x.id === id);
        if (p) { p.order_price = price; p.commission = comm; }
        editingId = null;
        applyFilters();
      } else alert('保存失败：' + (res.message || '未知错误'));
    })
    .catch(e => alert('保存失败：' + e.message))
    .finally(() => document.getElementById('loadingOverlay').classList.remove('show'));
}

// ===== 删除 =====
function deleteProject(id, name) {
  if (!confirm(`确认删除「${name}」？不可恢复。`)) return;
  document.getElementById('loadingOverlay').classList.add('show');
  client.db.from('projects').delete()
    .where({ id: id })
    .then(res => {
      if (res.success) {
        projects = projects.filter(p => p.id !== id);
        applyFilters();
      } else alert('删除失败：' + (res.message || '未知错误'));
    })
    .catch(e => alert('删除失败：' + e.message))
    .finally(() => document.getElementById('loadingOverlay').classList.remove('show'));
}

// ===== 加载 =====
function loadData() {
  document.getElementById('loadingOverlay').classList.add('show');
  client.db.from('projects')
    .select()
    .order('created_at', 'desc')
    .then(res => {
      projects = (res.data || []).map(r => ({
        id: r.id,
        project_name: r.project_name,
        cloud_link: r.cloud_link || '',
        total_duration: r.total_duration,
        total_episodes: r.total_episodes,
        software: r.software || '',
        production_days: r.production_days,
        team_size: r.team_size,
        compute_cost_per_min: parseFloat(r.compute_cost_per_min) || 0,
        total_compute_cost: parseFloat(r.total_compute_cost) || 0,
        order_price: parseFloat(r.order_price) || 0,
        commission: parseFloat(r.commission) || 0,
        created_at: r.created_at || ''
      }));
      applyFilters();
    })
    .catch(e => {
      document.getElementById('tableBody').innerHTML = `<tr><td colspan="12" style="text-align:center;padding:40px;color:var(--danger)">加载失败：${e.message}</td></tr>`;
    })
    .finally(() => document.getElementById('loadingOverlay').classList.remove('show'));
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

setInterval(loadData, 30000);
</script>
</body>
</html>
