<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2C3E50">
<title>制作登记 - 一抹金蓝</title>
<style>
  :root {
    --primary: #2C3E50;
    --accent: #3498DB;
    --accent-light: #EBF5FB;
    --success: #27AE60;
    --danger: #E74C3C;
    --warning: #F39C12;
    --text: #1a1a2e;
    --text-light: #7F8C8D;
    --muted: #BDC3C7;
    --bg: #F5F6FA;
    --card: #fff;
    --border: #E8ECF0;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #2C3E50, #3498DB);
    color: #fff;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header p { font-size: 12px; opacity: .6; margin-top: 2px; }

  .password-gate {
    background: var(--card); border-radius: var(--radius);
    padding: 48px 40px; text-align: center;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    max-width: 400px; margin: 120px auto;
  }
  .password-gate h2 { font-size: 18px; margin-bottom: 8px; color: var(--primary); }
  .password-gate p { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }
  .password-gate input {
    width: 100%; padding: 12px 16px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 16px; outline: none; text-align: center; letter-spacing: 4px;
  }
  .password-gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .password-gate .btn {
    width: 100%; padding: 12px; margin-top: 12px;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; background: var(--primary); color: #fff;
  }
  .password-gate .btn:hover { filter: brightness(1.2); }
  .password-gate .error { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }
  .hidden { display: none !important; }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px 32px 40px; }

  .stats-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.05);
    text-align: center; flex: 1; min-width: 120px;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .stat-card .label { font-size: 12px; color: var(--text-light); }

  .toolbar {
    display: flex; gap: 12px; margin-bottom: 16px;
    align-items: center; flex-wrap: wrap;
  }
  .toolbar input {
    flex: 1; max-width: 320px; padding: 9px 14px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; outline: none;
  }
  .toolbar input:focus { border-color: var(--accent); }
  .toolbar .btn-add {
    padding: 9px 24px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .toolbar .btn-add:hover { filter: brightness(1.08); }
  .toolbar select {
    padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; outline: none; background: #fff;
  }
  .toolbar select:focus { border-color: var(--accent); }

  .table-wrap {
    background: var(--card); border-radius: var(--radius);
    box-shadow: 0 1px 4px rgba(0,0,0,.05); overflow: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: #f8f9fb; padding: 11px 10px; text-align: left;
    font-weight: 600; font-size: 12px; color: var(--text-light);
    white-space: nowrap; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1;
  }
  td { padding: 10px 10px; border-bottom: 1px solid #f0f1f3; vertical-align: middle; }
  tr:hover td { background: #f8f9fc; }
  .amount { text-align: right; font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: 13px; }

  .editable { cursor: pointer; border-bottom: 1px dashed var(--accent); padding: 2px 0; }
  .editable:hover { background: var(--accent-light); border-radius: 3px; }
  .editable-input {
    width: 85px; padding: 4px 6px; border: 1.5px solid var(--accent);
    border-radius: 4px; font-size: 12px; outline: none; background: #fff;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  .edit-actions { display: inline-flex; gap: 3px; align-items: center; }
  .btn-save {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: none; border-radius: 4px;
    font-size: 13px; cursor: pointer; background: var(--success); color: #fff;
  }
  .btn-save:hover { filter: brightness(1.1); }
  .btn-cancel {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: none; border-radius: 4px;
    font-size: 13px; cursor: pointer; background: var(--border); color: var(--text-light);
  }
  .btn-cancel:hover { filter: brightness(.92); }
  .editing-row td { background: #f0f7ff !important; }

  .link-cell { font-size: 12px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-cell a { color: var(--accent); text-decoration: none; }
  .link-cell .locked { color: var(--text-light); font-style: italic; font-size: 11px; }

  .loading-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(44,62,80,.4); z-index: 999;
    justify-content: center; align-items: center;
  }
  .loading-overlay.show { display: flex; }
  .loading-box { background: #fff; border-radius: 18px; padding: 40px 48px; text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,.12); }
  .spinner { width: 36px; height: 36px; border: 3px solid #E8ECF0; border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.4); z-index: 1000;
    justify-content: center; align-items: flex-start; padding-top: 60px;
  }
  .modal-overlay.show { display: flex; }
  .modal-card {
    background: #fff; border-radius: 14px;
    width: 90%; max-width: 640px; max-height: 80vh; overflow-y: auto;
    padding: 32px 36px; box-shadow: 0 20px 60px rgba(0,0,0,.15);
  }
  .modal-card h2 { font-size: 18px; margin-bottom: 20px; color: var(--primary); }
  .modal-card .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .modal-card .form-group { margin-bottom: 16px; }
  .modal-card .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-light); }
  .modal-card .form-group input, .modal-card .form-group select {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  .modal-card .form-group input:focus, .modal-card .form-group select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light);
  }
  .modal-card .form-group input[readonly] { background: #f5f5f5; color: var(--primary); font-weight: 600; }
  .modal-footer { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
  .modal-footer .btn-primary { padding: 10px 32px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; }
  .modal-footer .btn-primary:hover { filter: brightness(1.08); }
  .modal-footer .btn-cancel { padding: 10px 32px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; background: #fff; color: var(--text-light); }
  .modal-footer .btn-cancel:hover { background: #f5f5f5; }

  .empty-state { text-align: center; padding: 48px; color: var(--text-light); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 12px 28px; border-radius: 8px;
    font-size: 14px; z-index: 2000; display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
  }
  .toast.show { display: block; animation: fadeInUp .3s ease; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  .footer { text-align: center; padding: 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📋 制作项目登记</h1>
    <p>一抹金蓝传媒 · 制作部</p>
  </div>
</div>

<div class="password-gate" id="passwordGate">
  <h2>🔐 请输入密码</h2>
  <p>本系统仅供一抹金蓝内部使用</p>
  <input type="password" id="pwdInput" placeholder="输入密码" onkeydown="if(event.key==='Enter')checkPwd()">
  <button class="btn" onclick="checkPwd()">验证</button>
  <div class="error" id="pwdError">密码错误，请重试</div>
</div>

<div class="container hidden" id="mainApp">

  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="statTotal">-</div><div class="label">项目总数</div></div>
    <div class="stat-card"><div class="num" id="statTotalCost">-</div><div class="label">总成本</div></div>
    <div class="stat-card"><div class="num" id="statRevenue">-</div><div class="label">总收入</div></div>
    <div class="stat-card"><div class="num" id="statProfit">-</div><div class="label">总利润</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 搜索项目..." oninput="applyFilters()">
    <select id="sortSelect" onchange="applyFilters()">
      <option value="newest">最新优先</option>
      <option value="oldest">最早优先</option>
    </select>
    <button class="btn-add" onclick="openAddModal()">+ 新增登记</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>项目名称</th>
          <th>时长</th>
          <th>集数</th>
          <th>制作周期</th>
          <th>人数</th>
          <th>每分钟算力成本</th>
          <th>总算力成本</th>
          <th>订单单价(元/分)</th>
          <th>总收入</th>
          <th>提成</th>
          <th>利润</th>
          <th>已结算</th>
          <th>提交时间</th>
          <th>网盘链接</th>
          <th style="width:50px">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">一抹金蓝传媒 · 制作部登记系统</div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box"><div class="spinner"></div><p>请稍候...</p></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <h2 id="modalTitle">📝 新增登记</h2>
    <div class="form-group">
      <label>项目名称 <span style="color:var(--danger)">*</span></label>
      <input type="text" id="f_name" maxlength="100" placeholder="请输入项目名称">
    </div>
    <div class="form-group">
      <label>提交时间 <span style="color:var(--danger)">*</span></label>
      <input type="date" id="f_subDate">
    </div>
    <div class="form-group">
      <label>网盘链接 <span style="color:var(--danger)">*</span></label>
      <input type="url" id="f_link" placeholder="https://pan.baidu.com/s/..." maxlength="500">
      <div style="font-size:11px;color:var(--muted);margin-top:4px">🔒 提交后1小时自动隐藏，仅后台可查看</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>总时长（分钟）<span style="color:var(--danger)">*</span></label>
        <input type="number" id="f_duration" min="1" oninput="calcCompute()">
      </div>
      <div class="form-group">
        <label>总集数 <span style="color:var(--danger)">*</span></label>
        <input type="number" id="f_episodes" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>制作周期（天）<span style="color:var(--danger)">*</span></label>
        <input type="number" id="f_days" min="1" oninput="calcCompute()">
      </div>
      <div class="form-group">
        <label>制作人数 <span style="color:var(--danger)">*</span></label>
        <input type="number" id="f_team" min="1">
      </div>
    </div>
    <div class="form-group">
      <label>制作软件</label>
      <input type="text" id="f_software" placeholder="如：AE、Blender、ComfyUI" maxlength="200">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>每分钟算力成本（元）<span style="color:var(--danger)">*</span></label>
        <input type="number" id="f_computePerMin" min="0" step="0.01" oninput="calcCompute()">
      </div>
      <div class="form-group">
        <label>总算力成本（元）</label>
        <input type="text" id="f_totalCompute" readonly>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>订单单价（元/分钟）</label>
        <input type="number" id="f_price" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>提成（元）</label>
        <input type="number" id="f_commission" min="0" step="0.01">
      </div>
    </div>
    <div class="form-group">
      <label>已结算金额（元）</label>
      <input type="number" id="f_settled" min="0" step="0.01">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-primary" id="modalSubmitBtn" onclick="modalSubmit()">✅ 提交</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ACCESS_PASSWORD = 'kl2026';
const API_BASE = 'https://baas.kuafuai.net/baas-api';
const API_KEY = 'baas_O4m66iqi';
const LINK_HIDE_HOURS = 1;

let allProjects = [];
let editingId = null;
let isAddMode = true;

async function api(method, data) {
  const url = API_BASE + '/api/data/invoke?table=projects&method=' + method;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'CODE_FLYING': API_KEY },
      body: JSON.stringify(data),
      signal: controller.signal
    });
    clearTimeout(timer);
    return await res.json();
  } catch(e) {
    clearTimeout(timer);
    throw new Error('网络请求失败：' + e.message);
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function checkPwd() {
  const input = document.getElementById('pwdInput').value.trim();
  if (input === ACCESS_PASSWORD) {
    document.getElementById('passwordGate').style.display = 'none';
    document.getElementById('mainApp').classList.remove('hidden');
    loadData();
  } else {
    document.getElementById('pwdError').style.display = 'block';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

function parseComputePower(p) {
  let perMin = 0, total = 0;
  if (p.computing_power && p.computing_power.startsWith('{')) {
    try {
      const j = JSON.parse(p.computing_power);
      perMin = parseFloat(j.perMin) || 0;
      total = parseFloat(j.total) || 0;
    } catch(e) {}
  }
  return { perMin, total };
}

function calcCosts(p) {
  const months = p.production_days / 26;
  const laborCost = months * p.team_size * 3500;
  const pcCost = months * p.team_size * 193;
  const venueCost = months * 8000;
  const compute = parseComputePower(p);
  const totalCost = laborCost + pcCost + venueCost + compute.total;
  const perMinPrice = parseFloat(p.order_price) || 0;
  const totalDuration = parseFloat(p.total_duration) || 0;
  const revenue = perMinPrice * totalDuration;
  const commission = parseFloat(p.commission) || 0;
  const profit = revenue - totalCost - commission;
  const settled = parseFloat(p.settled_amount) || 0;
  const unsettled = revenue - settled;
  return { months, laborCost, pcCost, venueCost, computePerMin: compute.perMin, computeCost: compute.total, totalCost, perMinPrice, revenue, commission, profit, settled, unsettled };
}

const fmt = v => '¥' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

function isLinkExpired(createdAt) {
  if (!createdAt) return false;
  const created = new Date(createdAt.replace(' ', 'T'));
  const now = new Date();
  return (now - created) / (1000 * 60 * 60) >= LINK_HIDE_HOURS;
}

function renderTable(list) {
  const tbody = document.getElementById('tableBody');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="15"><div class="empty-state"><div class="icon">📋</div><p>暂无项目数据，点击右上角「新增登记」开始</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = list.map(p => {
    const c = calcCosts(p);
    const isEditing = editingId === p.id;
    const profitClass = c.profit >= 0 ? '' : '';
    const profitIcon = c.profit >= 0 ? '📈' : '📉';
    const subDate = p.submission_date || '—';
    const expired = isLinkExpired(p.created_at);

    const computeCell = isEditing
      ? `<div class="edit-actions"><input class="editable-input" type="number" id="e_computePerMin-${p.id}" value="${c.computePerMin}" step="0.01" min="0" style="width:70px"></div>`
      : `<span class="editable" onclick="startEdit(${p.id})">${c.computePerMin > 0 ? '¥' + c.computePerMin.toFixed(2) : '—'}</span>`;

    const priceCell = isEditing
      ? `<input class="editable-input" type="number" id="e_price-${p.id}" value="${c.perMinPrice}" step="0.01" min="0">`
      : `<span class="editable" onclick="startEdit(${p.id})">${c.perMinPrice > 0 ? '¥' + c.perMinPrice.toFixed(2) : '—'}</span>`;

    const commCell = isEditing
      ? `<input class="editable-input" type="number" id="e_comm-${p.id}" value="${c.commission}" step="0.01" min="0">`
      : `<span class="editable" onclick="startEdit(${p.id})">${c.commission ? fmt(c.commission) : '—'}</span>`;

    const settledCell = isEditing
      ? `<input class="editable-input" type="number" id="e_settled-${p.id}" value="${c.settled}" step="0.01" min="0">`
      : `<span class="editable" onclick="startEdit(${p.id})">${c.settled ? fmt(c.settled) : '—'}</span>`;

    const actions = isEditing
      ? `<div class="edit-actions"><button class="btn-save" onclick="saveEdit(${p.id})">✓</button><button class="btn-cancel" onclick="cancelEdit()">✕</button></div>`
      : `<button class="btn-cancel" onclick="deleteItem(${p.id},'${p.project_name.replace(/'/g,"\\'")}')" style="font-size:11px;padding:3px 8px">🗑</button>`;

    const linkDisplay = expired
      ? '<span class="locked">🔒 已提交</span>'
      : `<a href="${p.cloud_link}" target="_blank">查看</a>`;

    const totalCompute = c.computeCost > 0 ? fmt(c.computeCost) : '—';

    return `<tr class="${isEditing ? 'editing-row' : ''}">
      <td><strong>${p.project_name}</strong></td>
      <td>${p.total_duration}min</td>
      <td>${p.total_episodes}集</td>
      <td>${p.production_days}天</td>
      <td>${p.team_size}人</td>
      <td class="amount">${computeCell}</td>
      <td class="amount">${totalCompute}</td>
      <td class="amount">${priceCell}</td>
      <td class="amount"><strong>${c.revenue > 0 ? fmt(c.revenue) : '—'}</strong></td>
      <td class="amount">${commCell}</td>
      <td class="amount">${profitIcon} ${fmt(c.profit)}</td>
      <td class="amount">${settledCell}</td>
      <td>${subDate}</td>
      <td class="link-cell">${linkDisplay}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
}

function updateStats(list) {
  document.getElementById('statTotal').textContent = list.length;
  let totalCost = 0, totalRevenue = 0, totalProfit = 0;
  list.forEach(p => {
    const c = calcCosts(p);
    totalCost += c.totalCost;
    totalRevenue += c.revenue;
    totalProfit += c.profit;
  });
  document.getElementById('statTotalCost').textContent = fmt(totalCost);
  document.getElementById('statRevenue').textContent = fmt(totalRevenue);
  document.getElementById('statProfit').textContent = fmt(totalProfit);
}

function applyFilters() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  let list = [...allProjects];
  if (keyword) list = list.filter(p => p.project_name.toLowerCase().includes(keyword));
  list.sort((a, b) => {
    return sort === 'oldest'
      ? new Date(a.created_at) - new Date(b.created_at)
      : new Date(b.created_at) - new Date(a.created_at);
  });
  renderTable(list);
  updateStats(list);
}

function calcCompute() {
  const perMin = parseFloat(document.getElementById('f_computePerMin').value) || 0;
  const duration = parseFloat(document.getElementById('f_duration').value) || 0;
  const total = perMin * duration;
  document.getElementById('f_totalCompute').value = total > 0 ? '¥' + total.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2}) : '';
  return total;
}

function openAddModal() {
  isAddMode = true;
  editingId = null;
  document.getElementById('modalTitle').textContent = '📝 新增登记';
  document.getElementById('modalSubmitBtn').textContent = '✅ 提交';
  ['f_name','f_subDate','f_link','f_duration','f_episodes','f_days','f_team','f_software','f_computePerMin','f_price','f_commission','f_settled'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f_totalCompute').value = '';
  document.getElementById('f_subDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('modalOverlay').classList.add('show');
}

function openEditModal(p) {
  isAddMode = false;
  editingId = p.id;
  document.getElementById('modalTitle').textContent = '✏️ 编辑项目：' + p.project_name;
  document.getElementById('modalSubmitBtn').textContent = '💾 保存修改';
  document.getElementById('f_name').value = p.project_name;
  document.getElementById('f_subDate').value = p.submission_date || '';
  document.getElementById('f_link').value = p.cloud_link || '';
  document.getElementById('f_duration').value = p.total_duration || '';
  document.getElementById('f_episodes').value = p.total_episodes || '';
  document.getElementById('f_days').value = p.production_days || '';
  document.getElementById('f_team').value = p.team_size || '';
  document.getElementById('f_software').value = p.software || '';

  const cp = parseComputePower(p);
  document.getElementById('f_computePerMin').value = cp.perMin || '';
  calcCompute();
  document.getElementById('f_price').value = p.order_price || '';
  document.getElementById('f_commission').value = p.commission || '';
  document.getElementById('f_settled').value = p.settled_amount || '';
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function modalSubmit() {
  const name = document.getElementById('f_name').value.trim();
  const subDate = document.getElementById('f_subDate').value.trim();
  const link = document.getElementById('f_link').value.trim();
  const duration = document.getElementById('f_duration').value.trim();
  const episodes = document.getElementById('f_episodes').value.trim();
  const days = document.getElementById('f_days').value.trim();
  const team = document.getElementById('f_team').value.trim();
  const software = document.getElementById('f_software').value.trim();
  const computePerMin = parseFloat(document.getElementById('f_computePerMin').value) || 0;
  const totalCompute = calcCompute();
  const price = parseFloat(document.getElementById('f_price').value) || 0;
  const commission = parseFloat(document.getElementById('f_commission').value) || 0;
  const settled = parseFloat(document.getElementById('f_settled').value) || 0;

  if (!name) { toast('请输入项目名称'); return; }
  if (!subDate) { toast('请选择提交时间'); return; }
  if (!link) { toast('请输入网盘链接'); return; }
  if (!duration || parseInt(duration) < 1) { toast('请输入有效的总时长'); return; }
  if (!episodes || parseInt(episodes) < 1) { toast('请输入有效的总集数'); return; }
  if (!days || parseInt(days) < 1) { toast('请输入有效的制作周期'); return; }
  if (!team || parseInt(team) < 1) { toast('请输入有效的制作人数'); return; }
  if (computePerMin < 0) { toast('请输入有效的每分钟算力成本'); return; }

  document.getElementById('loadingOverlay').classList.add('show');
  const compPower = JSON.stringify({ perMin: computePerMin, total: totalCompute });

  if (isAddMode) {
    const now = new Date().toISOString().replace('T', ' ').slice(0, 19);
    api('add', {
      project_name: name,
      submission_date: subDate,
      cloud_link: link,
      total_duration: duration,
      total_episodes: parseInt(episodes),
      software: software || '',
      production_days: parseInt(days),
      team_size: parseInt(team),
      computing_power: compPower,
      order_price: price,
      commission: commission,
      settled_amount: settled,
      created_at: now
    }).then(res => {
      if (res.success) {
        toast('✅ 登记成功！');
        closeModal();
        loadData();
      } else {
        toast('提交失败：' + (res.message || '未知错误'));
      }
    }).catch(e => toast('提交失败：' + e.message))
      .finally(() => document.getElementById('loadingOverlay').classList.remove('show'));
  } else {
    api('update', {
      id: editingId,
      project_name: name,
      submission_date: subDate,
      cloud_link: link,
      total_duration: duration,
      total_episodes: parseInt(episodes),
      software: software || '',
      production_days: parseInt(days),
      team_size: parseInt(team),
      computing_power: compPower,
      order_price: price,
      commission: commission,
      settled_amount: settled
    }).then(res => {
      if (res.success) {
        toast('✅ 修改已保存！');
        closeModal();
        editingId = null;
        loadData();
      } else {
        toast('保存失败：' + (res.message || '未知错误'));
      }
    }).catch(e => toast('保存失败：' + e.message))
      .finally(() => document.getElementById('loadingOverlay').classList.remove('show'));
  }
}

function startEdit(id) {
  const p = allProjects.find(x => x.id === id);
  if (p) openEditModal(p);
}

function cancelEdit() { editingId = null; applyFilters(); }

function saveEdit(id) {
  const computePerMin = parseFloat(document.getElementById(`e_computePerMin-${id}`).value) || 0;
  const price = parseFloat(document.getElementById(`e_price-${id}`).value) || 0;
  const comm = parseFloat(document.getElementById(`e_comm-${id}`).value) || 0;
  const settled = parseFloat(document.getElementById(`e_settled-${id}`).value) || 0;

  const p = allProjects.find(x => x.id === id);
  if (!p) return;

  const duration = parseFloat(p.total_duration) || 0;
  const totalCompute = computePerMin * duration;
  const compPower = JSON.stringify({ perMin: computePerMin, total: totalCompute });

  document.getElementById('loadingOverlay').classList.add('show');
  api('update', {
    id: id,
    computing_power: compPower,
    order_price: price,
    commission: comm,
    settled_amount: settled
  }).then(res => {
    if (res.success) {
      const np = allProjects.find(x => x.id === id);
      if (np) { np.computing_power = compPower; np.order_price = price; np.commission = comm; np.settled_amount = settled; }
      editingId = null;
      applyFilters();
      toast('✅ 已保存');
    } else { toast('保存失败：' + (res.message || '未知错误')); }
  }).catch(e => toast('保存失败：' + e.message))
    .finally(() => document.getElementById('loadingOverlay').classList.remove('show'));
}

function deleteItem(id, name) {
  if (!confirm(`确认删除「${name}」？此操作不可恢复。`)) return;
  document.getElementById('loadingOverlay').classList.add('show');
  api('delete', { id: id }).then(res => {
    if (res.success) { allProjects = allProjects.filter(p => p.id !== id); applyFilters(); toast('已删除'); }
    else { toast('删除失败：' + (res.message || '未知错误')); }
  }).catch(e => toast('删除失败：' + e.message))
    .finally(() => document.getElementById('loadingOverlay').classList.remove('show'));
}

function loadData() {
  document.getElementById('loadingOverlay').classList.add('show');
  const failTimer = setTimeout(() => {
    document.getElementById('loadingOverlay').classList.remove('show');
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="15" style="text-align:center;padding:40px;color:var(--danger)">⏱ 连接超时，<a href="javascript:loadData()" style="color:var(--accent)">点此重试</a></td></tr>';
  }, 20000);
  api('list', { orderBy: 'created_at', orderDir: 'desc', pageSize: 200 }).then(res => {
    clearTimeout(failTimer);
    allProjects = (res.data || []).map(r => ({
      id: r.id, project_name: r.project_name,
      cloud_link: r.cloud_link || '',
      total_duration: r.total_duration,
      total_episodes: r.total_episodes,
      software: r.software || '',
      production_days: r.production_days,
      team_size: r.team_size,
      computing_power: r.computing_power || '',
      order_price: parseFloat(r.order_price) || 0,
      commission: parseFloat(r.commission) || 0,
      submission_date: r.submission_date || '',
      settled_amount: parseFloat(r.settled_amount) || 0,
      created_at: r.created_at || ''
    }));
    applyFilters();
  }).catch(e => {
    clearTimeout(failTimer);
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="15" style="text-align:center;padding:40px;color:var(--danger)">加载失败：' + e.message + '，<a href="javascript:loadData()" style="color:var(--accent)">点此重试</a></td></tr>';
  }).finally(() => document.getElementById('loadingOverlay').classList.remove('show'));
}

setInterval(() => { if (allProjects.length > 0 && !document.getElementById('mainApp').classList.contains('hidden')) loadData(); }, 60000);
</script>
</body>
